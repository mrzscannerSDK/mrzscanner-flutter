name: mrzscanner
description: "MRZ scanner: reads passports, ID cards and visas with the camera (AR mode) or from photos, offline."
version: 2.7.4
homepage: https://mrzscanner.com/
topics: [mrz, passport, ocr, scanner, camera]

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.mrzscanner.flutter
        pluginClass: MrzscannerPlugin
      ios:
        pluginClass: MrzscannerPlugin
